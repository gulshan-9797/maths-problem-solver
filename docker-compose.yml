version: '3.8'

services:
  # ============================================================================
  # PostgreSQL: Storage layer for processed Big Data metrics and user feedback
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: math_solver_postgres
    restart: always
    environment:
      POSTGRES_DB: math_solver_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/analytics_views.sql:/docker-entrypoint-initdb.d/02_analytics_views.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d math_solver_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Grafana: Real-time Performance Monitoring & Analytics Dashboard
  # ============================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: math_solver_grafana
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/dashboard.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json

volumes:
  pgdata:
  grafana_data:
